name: verify
on:
  push:
    branches: [main, 'ci/**']
  pull_request:
    branches: [main, 'ci/**']
permissions:
  contents: read
jobs:
  unit:
    name: unit (${{ matrix.os }})
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Configure Git identity for test repositories
        run: |
          git config --global user.name "self-loop CI"
          git config --global user.email "ci@self-loop.invalid"
          git config --global init.defaultBranch main
          git config --global gc.auto 0
          git config --global maintenance.auto false
      - name: Run unit suite with relay
        env:
          SELF_LOOP_RELAY_DIR: ${{ runner.temp }}/self-loop-ci-relay
        run: node scripts/suite-green.mjs --repo . --sha HEAD --command "node --test scripts/test" --format node-test --relay

  acceptance:
    name: acceptance (${{ matrix.os }})
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Configure Git identity for test repositories
        run: |
          git config --global user.name "self-loop CI"
          git config --global user.email "ci@self-loop.invalid"
          git config --global init.defaultBranch main
          git config --global gc.auto 0
          git config --global maintenance.auto false
      - name: Run acceptance suite with relay
        env:
          SELF_LOOP_RELAY_DIR: ${{ runner.temp }}/self-loop-ci-relay
        run: node scripts/suite-green.mjs --repo . --sha HEAD --command "node --test acceptance" --format node-test --relay
