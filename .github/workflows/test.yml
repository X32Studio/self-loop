name: verify
on:
  push:
    branches: [main, 'ci/**']
  pull_request:
    branches: [main, 'ci/**']
permissions:
  contents: read
jobs:
  verify:
    name: suite (${{ matrix.os }})
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Configure Git identity for test repositories
        run: |
          git config --global user.name "self-loop CI"
          git config --global user.email "ci@self-loop.invalid"
          git config --global init.defaultBranch main
      - name: Run unit and acceptance suites
        run: |
          node --test scripts/test
          node --test acceptance
